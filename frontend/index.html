<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus-connect</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/resposive.css">
    <link rel="stylesheet" href="./css/resposive.css">
</head>

<body>

    <div id="main-container">

        <!-- mobile screen -->
        <div id="mobile-view">
            <!-- mobile top-bar -->
            <div id="top-bar">
                <h2>Campus Connect</h2>
                <img src="./assets/icons/user.png" alt="user" id="user-icon">
            </div>

            <!-- mobile-content-screen -->
            <div id="mobile-content"> </div>

            <!-- mobile-navbar-->

            <div id="mobile-navbar">
                <nav id="navbar">
                    <ul id="navbar-menu">
                        <li>
                            <a href="#">
                                <img src="./assets/icons/home-outline-icon.png" alt="home" id="home-outline-icon">
                                <!-- <img src="./assets/icons/home-filled-icon.png" alt="home" id="home-filled-icon"> -->
                            </a>
                        </li>

                        <li>
                            <a href="#">
                                <img src="./assets/icons/search-outline-icon.png" alt="search"
                                    id="search-outlined-icon">
                                <!-- <img src="./assets/icons/search-filled-icon.png" alt="search" id="search-filled-icon"> -->
                            </a>
                        </li>

                        <li>
                            <a href="#">
                                <img src="./assets/icons/mobile-post-outlined.png" alt="save"
                                    id="mobile-save-outline-icon">
                            </a>
                        </li>

                        <li>
                            <a href="#">
                                <img src="./assets/icons/post-outlined-icon.png" alt="post" id="post-outline-icon">
                                <!-- <img src="./assets/icons/post-filled-icon.png" alt="post" id="post-filled-icon"> -->
                            </a>
                        </li>

                        <li>
                            <a href="">
                                <img src="./assets/icons/save-outlined-icon.png" alt="save" id="save-outline-icon">
                                <!-- <img src="./assets/icons/save-filled-icon.png" alt="save" id="save-filled-icon"> -->
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>

        <!----------------------------------------------------------------------------------->

        <!-- large screens -->
        <div id="sidebar-section">

            <div id="sidebar-section-main">
                <div id="sidebar-section-title">

                    <h1>Campus Connect</h1>

                </div>

                <nav id="navbar">
                    <ul id="navbar-menu">
                        <li class="nav">
                            <a href="#">
                                <img src="./assets/icons/home-outline-icon.png" alt="home" id="home-icon">
                                Home
                            </a>
                        </li>

                        <li>
                            <a href="#">
                                <img src="./assets/icons/post-outlined-icon.png" alt="home" id="post-icon">
                                My Post
                            </a>
                        </li>

                        <li>
                            <a href="#">
                                <img src="./assets/icons/save-outlined-icon.png" alt="save" id="save-icon">
                                <!-- <img src="./assets/icons/save-filled-icon.png" alt="save" id="save-filled-icon"> -->
                                Saved
                            </a>
                        </li>

                        <li>
                            <a href="#">
                                <img src="./assets/icons/profile-outline-icon.png" alt="profile"
                                    id="profileicon">
                                <!-- <img src="./assets/icons/profile-filled-icon.png" alt="profile"
                                    id="profile-filled-icon"> -->
                                Profile
                            </a>
                        </li>

                        <li>
                            <a href="#">
                                <img src="./assets/icons/logout-outline-icon.png" alt="logout" id="logout-outline-icon">
                                <!-- <img src="./assets/icons/logout-filled-icon.png" alt="logout" id="logout-filled-icon"> -->
                                Logout
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>

            <div id="post-btn">
                <h5>Post</h5>
            </div>

        </div>
        <!----------------------------------------------------------------------------------------------------->

        <div id="hero-section">
            <div id="hero-section-topbar">
                <div id="hero-section-topbar-searchbar">
                    <img src="./assets/icons/search-filled-icon.png" alt="search-outline-icon" id="search-outline-icon">
                    <input type="search" placeholder="search events" id="search-events">
                </div>
            </div>

            <div id="hero-section-container">
                <div id="hero-section-content-box">
                    <div id="hero-post-user">
                        <div id="hero-post-profile">
                            <img src="./assets/icons/user.png" alt="user-icon">
                        </div>

                        <div id="hero-post-user-details">
                            <h6>Peter Parker</h6>
                            <p>@peterparker.cs21@bitsathy.ac.in</p>
                        </div>

                        <div id="hero-post-section-option-icon">
                            <img src="./assets/icons/options-icon.png" alt="option-icon" id="hero-option-icon">
                        </div>
                    </div>

                    <div id="hero-post-text-content">
                        <div id="post-text-area">
                            <p></p>
                        </div>
                        <span id="readme">more...</span>
                    </div>

                    <div id="hero-section-media">
                        <img src="./assets/images/postimage.png" alt="post">
                    </div>

                    <div id="hero-like-comment">
                        <a class="group-btn"><img src="./assets/icons/heart-outlined-icon.png" alt="like" id="like-btn">Like</a>
                        <a class="group-btn"><img src="./assets/icons/message-outlined-icon.png" alt="comment" id="comment-btn">Comment</a>
                        <a class="group-btn"><img src="./assets/icons/save-outlined-icon.png" alt="save" id="save-btn">Save</a>
                    </div>

                </div>
            </div>
        </div>

        <!-- --------------------------------------------------------------------------------------------------->
        <div id="comment-section"></div>

        <!-- ------------------------------------------------------------------------------------------------- -->

        <div id="post-container">
            <div class="post-container-group">
                
            </div>
        </div>

    </div>











































    <script src="./js/script.js"></script>
    <script src="./js/navigater.js"></script>
    <script src="./js/post.js"></script>
    <script src="./js/user.js"></script>
</body>

</html>
